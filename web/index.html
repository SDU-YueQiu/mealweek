<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#FBF7F0" />
<meta name="description" content="一人一锅的每周备餐卡" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="本周菜单" />
<title>本周菜单</title>
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="icon" href="/assets/icon-192.png" />
<link rel="apple-touch-icon" href="/assets/icon-192.png" />
<link rel="stylesheet" href="/style.css" />
</head>
<body>
<div id="notice" class="notice" hidden></div>
<div id="app" class="app">
  <div class="loading"><div class="spinner"></div><p>正在取这一周的菜单…</p></div>
</div>
<nav id="tabs" class="tabs" hidden></nav>
<div id="sheet" class="sheet" hidden></div>
<div id="lightbox" class="lightbox" hidden><img alt="" /><button class="lb-close" aria-label="关闭">×</button></div>
<div id="timer" class="timer" hidden></div>
<div id="toast" class="toast" hidden></div>
<script>
  // Register before the app boots so the shell is cached on the first visit.
  if ('serviceWorker' in navigator && (location.protocol === 'https:' ||
      /^(localhost|127\.0\.0\.1)$/.test(location.hostname))) {
    navigator.serviceWorker.register('/sw.js', { updateViaCache: 'none' }).catch(function () {});
    // An updated worker claims this page; reload once so the new app.js runs.
    navigator.serviceWorker.addEventListener('controllerchange', function () {
      if (window.__mwSWReload) return;
      window.__mwSWReload = true;
      location.reload();
    });
  }
</script>
<script src="/app.js"></script>
</body>
</html>
